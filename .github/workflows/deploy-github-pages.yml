name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compute GitHub Pages base path
        id: base
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          VITE_GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          VITE_GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          VITE_GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          VITE_GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          VITE_GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
